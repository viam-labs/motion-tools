name: Update E2E Snapshots

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-snapshots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        name: Install pnpm 🔧
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.11
          cache: true

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm playwright install chromium --with-deps

      - name: Install Viam CLI
        run: |
          curl --compressed -o /usr/local/bin/viam https://storage.googleapis.com/packages.viam.com/apps/viam-cli/viam-cli-stable-linux-amd64 && chmod a+rx /usr/local/bin/viam

      - name: Verify Viam CLI
        run: viam version

      - name: Run E2E tests with snapshot update
        run: pnpm test:e2e -- --update-snapshots
        env:
          VIAM_API_KEY: ${{ secrets.VIAM_API_KEY }}
          VIAM_API_KEY_ID: ${{ secrets.VIAM_API_KEY_ID }}

      - name: Check for snapshot changes
        id: check-changes
        run: |
          git diff --name-only e2e/**-snapshots/ > /tmp/changed-snapshots.txt
          git ls-files --others --exclude-standard e2e/**-snapshots/ >> /tmp/changed-snapshots.txt
          if [ -s /tmp/changed-snapshots.txt ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changed snapshots:"
            cat /tmp/changed-snapshots.txt
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No snapshot changes detected."
          fi

      - name: Commit and open PR
        if: steps.check-changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="snapshot-update/$(date +%Y-%m-%d)-${{ github.run_id }}"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git checkout -b "$BRANCH"
          git add e2e/
          git commit -m "chore: update e2e snapshots"
          git push origin "$BRANCH"

          CHANGED_FILES=$(cat /tmp/changed-snapshots.txt | sed 's/^/- /')

          gh pr create \
            --title "chore: update e2e snapshots ($(date +%Y-%m-%d))" \
            --body "$(cat <<EOF
          ## E2E Snapshot Updates

          This PR was automatically generated by the [Update E2E Snapshots](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow.

          ### Updated snapshots

          ${CHANGED_FILES}
          EOF
          )" \
            --head "$BRANCH" \
            --base main
