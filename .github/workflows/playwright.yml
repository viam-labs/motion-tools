name: Playwright Tests

on:
  pull_request:
    branches: [main] # JUST FOR TESTING

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: pnpm/action-setup@v6
        name: Install pnpm 🔧
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm playwright install chromium --with-deps

      - name: Install Viam CLI
        run: |
          sudo curl --compressed -o /usr/local/bin/viam https://storage.googleapis.com/packages.viam.com/apps/viam-cli/viam-cli-stable-linux-amd64
          sudo chmod a+rx /usr/local/bin/viam

      - name: Log in to Viam CLI
        run: viam login api-key --key-id="$VIAM_KEY_ID" --key="$VIAM_KEY_VALUE"
        env:
          VIAM_KEY_ID: ${{ secrets.VIAM_KEY_ID }}
          VIAM_KEY_VALUE: ${{ secrets.VIAM_KEY_VALUE }}

      - name: Run e2e setup
        run: ./e2e/setup.sh

      - name: Run Playwright tests
        run: pnpm playwright test e2e/edit-frame.test.ts e2e/file-drop.test.ts e2e/arm.test.ts --config playwright.ci.config.ts -u

      - name: Open or update PR with refreshed snapshots
        id: snapshot-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add e2e/edit-frame.test.ts-snapshots/ e2e/file-drop.test.ts-snapshots/

          if git diff --staged --quiet; then
            echo "No snapshot changes to commit"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SOURCE_BRANCH="${{ github.event.pull_request.head.ref }}"
          BOT_BRANCH="BOT-update-e2e-screenshot-${{ github.event.pull_request.number }}"

          # Bot-owned branch: always reset it to the current PR head plus the
          # refreshed snapshots, rather than trying to reconcile history with
          # whatever it held before.
          git checkout -B "$BOT_BRANCH"
          git commit -m "Update e2e screenshot baselines"
          git push --force origin "HEAD:$BOT_BRANCH"

          EXISTING_PR=$(gh pr list --head "$BOT_BRANCH" --state open --json number --jq '.[0].number')

          if [ -z "$EXISTING_PR" ]; then
            PR_URL=$(gh pr create \
              --head "$BOT_BRANCH" \
              --base "$SOURCE_BRANCH" \
              --title "Update e2e screenshot baselines for #${{ github.event.pull_request.number }}" \
              --body "Auto-generated by the Playwright Tests workflow after a passing run against #${{ github.event.pull_request.number }}.")
          else
            PR_URL=$(gh pr view "$EXISTING_PR" --json url --jq '.url')
            echo "Pushed to existing PR #$EXISTING_PR"
          fi

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.VIZ_E2E_SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: C05D8LPC2TA
            text: "Playwright e2e tests failed for PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.html_url }}).\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify Slack of snapshot update PR
        if: steps.snapshot-pr.outputs.pr_url != ''
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.VIZ_E2E_SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: C05D8LPC2TA
            text: "Playwright e2e screenshots changed for PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.html_url }}) — review the update: ${{ steps.snapshot-pr.outputs.pr_url }}"

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
